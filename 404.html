<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <script>
      (function () {
        var path = window.location.pathname;
        var search = window.location.search || '';
        var hash = window.location.hash || '';
        var configuredBase = '/GamlingaySnooker';
        var usesProjectBase = path === configuredBase || path.indexOf(configuredBase + '/') === 0;
        var projectBase = usesProjectBase ? configuredBase : '';
        var relativePath = projectBase ? path.slice(projectBase.length) : path;

        var target = projectBase + '/?p=' + encodeURIComponent(relativePath + search + hash);
        window.location.replace(target);
      })();
      // GitHub Pages SPA fallback redirect (project pages)
      const path = window.location.pathname;
      const search = window.location.search || '';
      const hash = window.location.hash || '';
      const projectBase = '/GamlingaySnooker';
      const relativePath = path.startsWith(projectBase) ? path.slice(projectBase.length) : path;
      const target = `${projectBase}/?p=${encodeURIComponent(relativePath + search + hash)}`;
      window.location.replace(target);
    </script>
  </head>
  <body></body>
</html>
